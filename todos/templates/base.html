<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAML Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --planning: #a78bfa;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        nav {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .user-info {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .user-info a {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            background: var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .user-info a:hover {
            background: var(--accent-color);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            background-color: var(--border-color);
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.2);
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Kanban Board */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            min-height: 60vh;
        }

        @media (max-width: 1024px) {
            .kanban-board {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }
        }

        .kanban-column {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            min-height: 200px;
        }

        .kanban-column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .kanban-column-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .kanban-count {
            background: var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
        }

        /* Status Badges */
        .status-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .status-OPEN { background: rgba(59, 130, 246, 0.15); color: var(--accent-color); }
        .status-PLANNING { background: rgba(167, 139, 250, 0.15); color: var(--planning); }
        .status-ONGOING { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-CLOSED { background: rgba(16, 185, 129, 0.15); color: var(--success); }

        .column-OPEN .kanban-column-header { border-bottom-color: var(--accent-color); }
        .column-PLANNING .kanban-column-header { border-bottom-color: var(--planning); }
        .column-ONGOING .kanban-column-header { border-bottom-color: var(--warning); }
        .column-CLOSED .kanban-column-header { border-bottom-color: var(--success); }

        /* User Avatars */
        .avatar-group {
            display: flex;
            gap: 0;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 600;
            color: white;
            margin-left: -6px;
            border: 2px solid var(--surface-color);
            text-transform: uppercase;
        }

        .avatar:first-child { margin-left: 0; }
        .avatar-1 { background: #6366f1; }
        .avatar-2 { background: #ec4899; }
        .avatar-3 { background: #f59e0b; }
        .avatar-4 { background: #10b981; }
        .avatar-5 { background: #ef4444; }
        .avatar-6 { background: #8b5cf6; }

        /* Search Select Widget */
        .search-select {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-select input[type="text"] {
            margin-bottom: 0;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            margin-top: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .search-dropdown.active {
            display: block;
        }

        .search-dropdown-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s;
        }

        .search-dropdown-item:hover {
            background: var(--border-color);
        }

        .search-dropdown-item .name {
            color: var(--text-primary);
        }

        .search-dropdown-item .username {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .selected-users {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .selected-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-color);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .selected-tag .remove-tag {
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .selected-tag .remove-tag:hover {
            opacity: 1;
        }

        .todo-card-text {
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .todo-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .todo-card-id {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .empty-column {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 2rem 0.5rem;
            opacity: 0.6;
        }

        /* View Toggle */
        .view-toggle {
            display: flex;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 0.5rem 0.65rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }

        .view-btn:hover {
            color: var(--text-primary);
            background: var(--border-color);
        }

        .view-btn.active {
            color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1);
        }

        /* Stacked View */
        .stacked-section {
            margin-bottom: 1.5rem;
        }

        .stacked-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <nav>
        <h1>SAML Tasks</h1>
        <div class="user-info">
            {% if user.is_authenticated %}
                <span>{{ user.username }} ({{ user.groups.all|join:", " }})</span>
                {% if user.is_staff %}
                    <a href="/admin/">Admin Panel</a>
                {% endif %}
            {% else %}
                <span>Not logged in</span>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
