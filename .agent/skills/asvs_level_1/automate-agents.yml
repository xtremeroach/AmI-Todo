name: Auto-branch and Merge Agents

on:
  workflow_dispatch: # Allows you to run this manually
  # You could also trigger this on a repository_dispatch from an external script

jobs:
  update-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary to perform merges

      - name: Create New Branch
        run: |
          BRANCH_NAME="update-agents-$(date +'%Y%m%d-%H%M%S')"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Make Changes to agents.md
        run: |
          # Replace this with your actual logic/script that edits the file
          echo "- Agent added on $(date)" >> agents.md 

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.md
          git commit -m "Automated update to agents.md"
          git push origin ${{ env.BRANCH_NAME }}

      - name: Run Tests
        run: |
          # Replace this with your actual test command
          # If this command returns a non-zero exit code, the workflow stops here
          npm test 

      - name: Merge to Main
        if: success()
        run: |
          git checkout main
          git merge ${{ env.BRANCH_NAME }}
          git push origin main